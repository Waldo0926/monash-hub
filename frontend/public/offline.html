<!doctype html>
<!--
  Shown by the service worker when there is no network and the page asked for
  was never saved. Plain HTML with everything inline: it has to work with no
  server behind it. The language follows the site's own cookie, then the
  browser's language, and it lists the pages that are saved, so a student
  stuck without signal still has somewhere to go.
-->
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006DAE">
  <meta name="robots" content="noindex">
  <title>Monash Hub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: #fcfcfd;
      color: #1a2433;
      line-height: 1.6;
    }
    main { max-width: 36rem; margin: 0 auto; padding: 48px 20px 64px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 32px; }
    .brand img { width: 32px; height: 32px; }
    h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 12px; }
    p { margin: 0 0 16px; color: #4a5568; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: #006dae;
      border: 0; border-radius: 8px; padding: 10px 18px; min-height: 44px; cursor: pointer;
    }
    button:focus-visible, a:focus-visible { outline: 3px solid #7cc0ea; outline-offset: 2px; }
    h2 { font-size: 1rem; margin: 40px 0 8px; }
    ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid #e3e8ef; }
    li a {
      display: block; padding: 12px 2px; border-bottom: 1px solid #e3e8ef;
      color: #005a8f; text-decoration: none;
    }
    li a:hover { text-decoration: underline; }
    .path { display: block; font-size: 0.8rem; color: #718096; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/favicon.svg" alt="">Monash Hub</div>
    <h1 data-text="title">现在没有网络</h1>
    <p data-text="body">这个页面还没有保存过，联网后才能打开。看过的课程、学位和指南页面，没网时也能打开。</p>
    <button type="button" data-text="retry" onclick="location.reload()">重试</button>
    <section id="saved" hidden>
      <h2 data-text="saved">已保存的页面</h2>
      <ul id="saved-list"></ul>
    </section>
  </main>
  <script>
    (function () {
      var TEXT = {
        en: {
          lang: 'en',
          title: 'You are offline',
          body: 'This page has not been saved yet, so it needs a connection. Unit, degree and guide pages you have already opened still work offline.',
          retry: 'Try again',
          saved: 'Saved pages'
        },
        zh: {
          lang: 'zh-Hans',
          title: '现在没有网络',
          body: '这个页面还没有保存过，联网后才能打开。看过的课程、学位和指南页面，没网时也能打开。',
          retry: '重试',
          saved: '已保存的页面'
        },
        ja: {
          lang: 'ja',
          title: 'オフラインです',
          body: 'このページはまだ保存されていないため、接続が必要です。一度開いた科目・学位・ガイドのページはオフラインでも見られます。',
          retry: '再読み込み',
          saved: '保存済みのページ'
        },
        ko: {
          lang: 'ko',
          title: '오프라인 상태입니다',
          body: '이 페이지는 아직 저장되지 않아 인터넷 연결이 필요합니다. 이미 열어 본 과목, 학위, 가이드 페이지는 오프라인에서도 볼 수 있습니다.',
          retry: '다시 시도',
          saved: '저장된 페이지'
        }
      }

      function pickLocale() {
        var match = document.cookie.match(/(?:^|;\s*)mh_locale=([a-z]+)/)
        if (match && TEXT[match[1]]) return match[1]
        var langs = navigator.languages || [navigator.language || '']
        for (var i = 0; i < langs.length; i++) {
          var code = String(langs[i]).slice(0, 2).toLowerCase()
          if (TEXT[code]) return code
        }
        return 'en'
      }

      var t = TEXT[pickLocale()]
      document.documentElement.lang = t.lang
      document.title = t.title + ' | Monash Hub'
      var nodes = document.querySelectorAll('[data-text]')
      for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t[nodes[i].getAttribute('data-text')]

      // The service worker names its page cache mh-pages-<version>.
      if (!('caches' in window)) return
      caches.keys().then(function (names) {
        var name = names.filter(function (n) { return n.indexOf('mh-pages-') === 0 })[0]
        if (!name) return
        return caches.open(name).then(function (cache) {
          return cache.keys().then(function (requests) {
            var recent = requests.slice(-30).reverse()
            return Promise.all(recent.map(function (request) {
              return cache.match(request)
                .then(function (response) { return response.text() })
                .then(function (html) {
                  var found = html.match(/<title[^>]*>([^<]*)<\/title>/i)
                  var holder = document.createElement('textarea')
                  holder.innerHTML = found ? found[1] : ''
                  return { url: request.url, title: holder.value }
                })
            }))
          })
        })
      }).then(function (pages) {
        if (!pages || !pages.length) return
        var list = document.getElementById('saved-list')
        pages.forEach(function (page) {
          var url = new URL(page.url)
          var link = document.createElement('a')
          link.href = url.pathname + url.search
          link.textContent = page.title || url.pathname
          var path = document.createElement('span')
          path.className = 'path'
          path.textContent = url.pathname + url.search
          link.appendChild(path)
          var item = document.createElement('li')
          item.appendChild(link)
          list.appendChild(item)
        })
        document.getElementById('saved').hidden = false
      }).catch(function () {})
    })()
  </script>
</body>
</html>
