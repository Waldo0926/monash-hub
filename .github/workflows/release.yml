name: Release

# Pushing a tag like v1.2.0 publishes a GitHub Release, after checking that the
# tag, backend/app/version.py and the CHANGELOG agree and that CI passes on
# that exact commit. Nothing here deploys: production follows main through
# the Deploy workflow, and a tag only names a commit that is already there.
# See docs/RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Tag, version and changelog agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare the tag with backend/app/version.py
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/app/version.py)"
          if [[ -z "$version" ]]; then
            echo "::error::backend/app/version.py has no __version__ line"
            exit 1
          fi
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag v$tag does not match __version__ = \"$version\". Bump the version in the same PR as the changelog, then tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the CHANGELOG has a section for this version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if ! grep -Eq "^## $version( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' heading. Move the Unreleased notes under one before tagging."
            exit 1
          fi

  ci:
    name: CI on the tagged commit
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the GitHub Release
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Take the release notes from the CHANGELOG section
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          # From the version heading to the line before the next "## ".
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            echo "::error::The CHANGELOG section for $version is empty"
            exit 1
          fi
          printf '\nFull changelog: https://github.com/%s/blob/%s/CHANGELOG.md\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> "$RUNNER_TEMP/notes.md"

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Monash Hub $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
