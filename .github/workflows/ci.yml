name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: monashhub
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: monashhub_test
        options: >-
          --health-cmd "pg_isready -U monashhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+psycopg://monashhub:testpass@localhost:5432/monashhub_test
      TEST_DATABASE_URL: postgresql+psycopg://monashhub:testpass@localhost:5432/monashhub_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Audit Python dependencies for known vulnerabilities
        # The API image's pins, and everything they pull in, looked up in the
        # PyPI advisory database. A new advisory fails the build until the
        # package is upgraded or the finding is written down with a reason.
        # The crawler image adds argostranslate, which pins stanza 1.10.1
        # (PYSEC-2026-3075) and cannot be moved on its own; that container has
        # no published port and only sees text it fetched itself.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Lint
        run: ruff check --config ruff.toml backend crawler

      - name: Check the migrations build the schema the models describe
        working-directory: backend
        run: |
          alembic upgrade head
          # If autogenerate finds nothing to do, the models and the migrations
          # agree. Catching drift here is much cheaper than catching it during
          # a deploy.
          alembic revision --autogenerate -m drift-check --rev-id driftcheck
          generated="$(ls migrations/versions/driftcheck_*.py)"
          if grep -qE '^\s+op\.(create|drop|add|alter)' "$generated"; then
            echo "::error::Models and migrations have drifted apart."
            cat "$generated"
            exit 1
          fi
          rm "$generated"

      - name: Tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Audit npm dependencies for known vulnerabilities
        # The whole lockfile, build tooling included: the web container is
        # built from it, and Nuxt's server renderer is a production
        # dependency. A high or critical advisory fails the build unless
        # scripts/audit.mjs lists it with a reason.
        working-directory: frontend
        run: npm run audit

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
