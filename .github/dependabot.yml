# Dependency updates, grouped so a month's worth of bumps is one PR per
# ecosystem rather than one PR per package. Every PR runs CI, which audits the
# dependency tree and runs the tests against a real PostgreSQL, and a merge to
# main deploys, so the review is the same as for any other change.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /crawler
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    labels: [dependencies]
    ignore:
      # TypeScript 7 is the Go compiler and has no programmatic API until 7.1,
      # so vue-tsc (what `nuxi typecheck` runs) cannot load it and the
      # typecheck step fails. Drop this once vue-tsc supports 7.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /crawler]
    schedule:
      interval: monthly
    labels: [dependencies]
