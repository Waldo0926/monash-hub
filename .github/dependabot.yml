# Dependency updates, grouped so a month's worth of bumps is one PR per
# ecosystem rather than one PR per package. Every PR runs CI, which audits the
# dependency tree and runs the tests against a real PostgreSQL, and a merge to
# main deploys, so the review is the same as for any other change.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /crawler
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    labels: [dependencies]
    ignore:
      # vue-tsc (what `nuxi typecheck` runs) does not support TypeScript 7 yet;
      # the typecheck step fails with it. Drop this once vue-tsc supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /crawler]
    schedule:
      interval: monthly
    labels: [dependencies]
