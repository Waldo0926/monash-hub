name: Feature request / 功能建议
description: Something the site should do. / 希望网站加的功能。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / 你想做什么？
      description: The situation, not the solution. / 先说场景，不用先说方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help / 希望怎么做
  - type: textarea
    id: today
    attributes:
      label: How you do it today / 现在是怎么做的
      description: For example on the Monash site, a spreadsheet, or asking in a group chat. / 比如在 Monash 官网、表格里，或者在群里问。
