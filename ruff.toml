# Shared by backend/ and crawler/.
line-length = 100
target-version = "py312"
exclude = [".venv", ".venv-crawler", "frontend", "backend/migrations/versions"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends() in defaults is the framework's own idiom
    "RUF001",  # curly quotes and CJK punctuation are intentional in seed text
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
"backend/tests/*" = ["E501"]
# Translations are data, not code. A Chinese sentence broken every hundred
# columns lands mid-clause, so the file stops being readable as prose and a
# one-word change reflows the lines around it. The English keys have to match
# the source character for character either way.
"backend/app/knowledge/translations_seed.py" = ["E501"]
