# Rate limit zones for Monash Hub. Goes in /etc/nginx/conf.d/ because
# limit_req_zone has to live in the http block, not inside a server block.
#
# Sized for a student site, not a CDN: the API allowance is generous enough for
# a person clicking around and small enough that a script gets noticed.
limit_req_zone $binary_remote_addr zone=monashhub_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=monashhub_write:10m rate=1r/s;
