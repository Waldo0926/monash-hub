# Rate limit zones for Monash Hub. Goes in /etc/nginx/conf.d/ because
# limit_req_zone has to live in the http block, not inside a server block.
#
# Sized for a student site, not a CDN: the API allowance is generous enough for
# a person clicking around and small enough that a script gets noticed.
#
# A university's Wi-Fi puts a whole lecture theatre behind a handful of
# addresses, so the per-address allowance has to be generous. Protecting an
# individual account from password guessing is the API's job (see
# backend/app/core/throttle.py), because only it knows which account is meant.
limit_req_zone $binary_remote_addr zone=monashhub_api:10m rate=20r/s;

# The write zone counts writes only. It used to count every request to the
# paths it guards, so reading the forum - GET /api/v1/community/posts - was
# held to one request a second per address, and a campus full of readers got
# 429s. An empty key is not counted. (A new zone name, because nginx refuses
# to reload a zone under the same name with a different key.)
map $request_method $monashhub_write_key {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
    OPTIONS "";
}
limit_req_zone $monashhub_write_key zone=monashhub_writes:10m rate=1r/s;
