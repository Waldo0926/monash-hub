# nginx site for monashhub.secureview.tech
#
# The server already runs nginx for other projects, so this is one more server
# block rather than a second proxy fighting for 80/443. Install it as
# /etc/nginx/sites-available/monash-hub and symlink it into sites-enabled;
# certbot --nginx adds the TLS lines and the HTTP redirect.
#
# Same origin for everything: / goes to Nuxt, /api/ goes to FastAPI. No api
# subdomain means no CORS configuration and no second certificate.

server {
    listen 80;
    listen [::]:80;
    server_name monashhub.secureview.tech;

    # Certbot needs this to stay open for unattended renewals.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 on this host predates the standalone `http2 on;` directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monashhub.secureview.tech;

    access_log /var/log/nginx/monash-hub.access.log;
    error_log  /var/log/nginx/monash-hub.error.log;

    ssl_certificate     /etc/letsencrypt/live/monashhub.secureview.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monashhub.secureview.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # This is an independent platform, not a Monash property. Do not let it be
    # framed by anything, and do not leak referrers to third parties.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    # Posting is rate limited per IP. A public forum without this is a spam
    # target from the first day it is linked anywhere.
    location /api/v1/community/posts {
        limit_req zone=monashhub_write burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        limit_req zone=monashhub_write burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=monashhub_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8101;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
