# Local loopback-only Nginx site for ICP-pending verification on Tencent Cloud.
#
# Listens ONLY on 127.0.0.1:18080 (never 0.0.0.0:80 or 0.0.0.0:443).
# Preview from local machine via:
#   ssh -N -L 18080:127.0.0.1:18080 vps
#   open http://127.0.0.1:18080

server {
    listen 127.0.0.1:18080;
    server_name _;

    access_log /var/log/nginx/monashhub-local.access.log;
    error_log  /var/log/nginx/monashhub-local.error.log;

    client_max_body_size 1m;

    # Avatar uploads/static files are completely disabled in CN read-only mode.
    location ^~ /avatars/ {
        return 404;
    }

    # Nuxt hashed build assets.
    location ^~ /_nuxt/ {
        proxy_pass http://127.0.0.1:18101;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # FastAPI read-only backend.
    location /api/ {
        proxy_pass http://127.0.0.1:18100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Nuxt SSR frontend.
    location / {
        proxy_pass http://127.0.0.1:18101;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
