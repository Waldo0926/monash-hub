# Response headers for every Monash Hub location. Install as
# /etc/nginx/snippets/monash-hub-headers.conf; monash-hub.conf includes it at
# server level and again in any location that adds headers of its own.
#
# This is an independent platform, not a Monash property. Do not let it be
# framed by anything, and do not leak referrers to third parties.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# No script policy: Nuxt inlines its hydration payload, and a CSP that breaks
# the page is worse than none. These parts cost nothing and close real doors.
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
add_header Permissions-Policy "microphone=(), geolocation=(), payment=(), usb=()" always;
