ate Certificate, Graduate Diploma, Masters Degree or Doctorate.","Offering Periods":"An academic teaching period of between 10-13 weeks in duration.","Research":"A level of study which involves a student independently researching a specific topic under the guidance of a supervisor and producing a thesis or report. Some research programs involve a coursework component.","Delivery Mode":"The delivery option(s) by which a course or program is offered.","Award(s)":"A qualification given once all requirements of a program have been successfully met.","Offering Terms":"An academic teaching period of between 10-13 weeks in duration.","Course":"A component of an academic program, normally of one term/semester in duration, with a specific credit value.","Semester/Term":"An academic teaching period of between 10-13 weeks in duration.","School":"The academic unit responsible for teaching in disciplines or subject areas (school is part of a Faculty)","Major":"A specified field of study representing a principle discipline interest within a program. More than one major may be completed within a program.","General Education":"Courses taken outside of the home faculty to complement more specialised learning. Students are still subject to Faculty and program specific conditions/requirements on General Education selection.","Graduate Capabilities":"Qualities, skills and understandings beyond, disciplinary expertise or technical knowledge that students should develop during their time at Monash University.","Dual Award Program":"An award where two or more programs are studied at the same time, resulting in two separate qualifications.","Articulation Arrangements":"An approved agreement which enables students to progress in a defined pathway from one qualification to another with credit.","Double Degree":"An award where two or more programs are studied at the same time, resulting in two separate qualifications.","Minimum Units of Credit":"This is some text","Faculty":"The primary academic unit in which related disciplines of teaching and research are conducted.","Honours":"The highest level of learning in an undergraduate program. It typically includes a research component. Honours is available in two modes: separate year honours and embedded honours.","Equivalent Courses":"A course deemed to be equal in academic content to another course. You will need to choose a different course if you have successfully completed the equivalent course.","Minor":"A specified field of study within a discipline or sub-discipline, smaller in size and scope than a major. ","Units of Credit":"(UOC) A value attached to courses and programs which indicates the study workload eg. class contact hours, other learning activities, preparation and time spent on all assessable work.","Exclusion Courses":"A course students are prevented from taking, because they have academic content in common with courses for which the student has previously been granted credit.","Program":"An approved set of requirements, courses and/or supervised research into which a student is admitted. In some cases, this will lead to an award of Monash University.","Learning Outcomes":"This is some text","Specialisation":"A sequence of study developing knowledge and competency in a specific area within a program.","UOC":"Units of Credit","Indicative contact hours":"Typically refers to face to face on-campus contact hours per week."},"aos_search_filter":"Area of Interest","course_search_filter":"Year","readmore_calltoaction":"Read More","academic_item_quick_links_linkURL":[{"order":"7","label":"Timetable information","value":"https://www.monash.edu/timetables"},{"order":"5","label":"Admissions, fees and timetable (Indonesia)","value":"https://www.monash.edu/study/indonesia-campus-courses/student-faqs"},{"order":"1","label":"Census dates and teaching periods","value":"https://www.monash.edu/enrolments/dates/census"},{"order":"2","label":"Technology Requirements","value":"https://www.monash.edu/esolutions ","cl_id":"f1fcbca9dbc30610ac9b3ea1f3961966","key":"display_name"},"published_in_handbook":{"label":"Yes","value":"1"},"implementation_year":"2026","duration_ft_max":"","asced_detailed":{"value":"","cl_id":null,"key":"display_value"},"grading_schema":{"label":null,"value":null},"study_level":[],"quota_enrolment_requirements":"","status":{"label":"Accredited","value":"Active"},"duration_pt_max":"","duration_pt_std":"","credit_points":"6","parent_id":{"value":"Master Record: FIT1008","cl_id":"da946a10dbf4b300580f42a0149619d7","key":"code","type":"x_f5sl_cl_master_record"},"start_date":"","exclusions":"","unit_code":"FIT1008","academic_org":{"value":"Faculty of Information Technology","cl_id":"c5684a53dba8a3406add773c349619a1","key":"name"},"sms_version":"","level":{"label":"Level 1","value":"2"},"uac_code":"","special_requirements":"","duration_pt_min":"","special_unit_type":[],"title":"Fundamentals of algorithms","duration_ft_std":"","version":"10","learning_experiences":null,"handbook_synopsis":"\u003cp\u003eFrom Semester 2, 2026: Data structures and algorithms are the tools that allow programs to solve problems efficiently, reliably and at scale. This unit develops the core algorithmic thinking and implementation skills needed to move from a problem statement to a well-structured computational solution. You will learn to represent problems using appropriate data structures, design algorithms that use those structures effectively, and reason about how choices affect correctness, performance and maintainability. The unit covers recursion, introductory complexity analysis, and structures such as stacks, queues, trees, heaps and hash tables. You will evaluate algorithm behaviour both theoretically and experimentally, building a practical understanding of time, space and trade-offs. Through structured programming activities, you will strengthen your ability to design, implement, test and explain algorithmic solutions. The unit builds disciplined habits of precise reasoning, careful coding, performance awareness and reflection, preparing you for later study in advanced algorithms, software design, artificial intelligence, systems and computational problem solving.\u003c/p\u003e\n\u003cp\u003eSemester 1, 2026: This unit introduces you to core problem-solving, analytical skills, and methodologies useful for developing flexible, robust, and maintainable software. In doing this, it covers a range of conceptual levels, from fundamental algorithms and data structures, down to their efficient implementation as well as complexity. Topics include data types, data structures, algorithms, algorithmic complexity, recursion, and their practical applications.\u003c/p\u003e","duration_ft_min":"","callista_version":"","duration_ft_period":{"label":null,"value":null},"asced_narrow":{"value":"","cl_id":null,"key":"display_value"},"subclass":{"label":"Unit","value":"subject"},"type":{"label":"Coursework","value":"600"},"quota_rationale":"","version_name":"2026.10","timetable_this_unit":"true","work_integrated_learning":[{"value":"None","cl_id":"8ef5d77bdb122300e5cf3391f496191d","key":"label"}],"cl_id":"9ea707f147c20b10448f409b136d43bd","school":{"value":"Faculty of Information Technology","cl_id":"c5684a53dba8a3406add773c349619a1","key":"name"},"content":null,"learning_and_teaching_resources":null,"collaborating_disciplines":[],"repeatable":"false","overview":"","end_date":"","duration_pt_period":{"label":null,"value":null},"sms_status":{"label":null,"value":null},"learning_materials":null,"special_topic":"true","asced_broad":{"value":"","cl_id":null,"key":"display_value"},"publish_tuition_fees":"true","placement_proportion":{"label":null,"value":null},"code":"FIT1008","organisational_contact_information":"","unit_learning_outcomes":[{"lo_domain":[],"order":"1","number":"1","code":"ULO1","lo_cl_id":"eea707f147c20b10448f409b136d43d5","lo_domain_description":"","offerings":[],"linking_id":"3227abbec31a921040721d4bb001313d","academic_item":{"value":"FIT1008","cl_id":"9ea707f147c20b10448f409b136d43bd","key":"code"},"description":"\u003cp\u003eSemester 2: Analyse computational problems to identify suitable algorithmic strategies, data representations and performance considerations.\u003c/p\u003e\n\u003cp\u003eSemester 1: Translate problem statements into algorithms and implement them in a high level programming language;\u003c/p\u003e","cl_id":"eea707f147c20b10448f409b136d43d5","ga_map":[]},{"lo_domain":[],"order":"5","number":"5","code":"ULO5","lo_cl_id":"e6a707f147c20b10448f409b136d43d6","lo_domain_description":"","offerings":[],"linking_id":"523613e7c3b9cf1002fcfb777d013108","academic_item":{"value":"FIT1008","cl_id":"9ea707f147c20b10448f409b136d43bd","key":"code"},"description":"\u003cp\u003eSemester 2: Plan, monitor, and reflect on the development of your algorithmic thinking and implementation practice through focused problem solving, feedback and iterative improvement.\u003c/p\u003e","cl_id":"e6a707f147c20b10448f409b136d43d6","ga_map":[]},{"lo_domain":[],"order":"3","number":"3","code":"ULO3","lo_cl_id":"eaa707f147c20b10448f409b136d43d6","lo_domain_description":"","offerings":[],"linking_id":"7a11e3bec396921040721d4bb0013160","academic_item":{"value":"FIT1008","cl_id":"9ea707f147c20b10448f409b136d43bd","key":"code"},"description":"\u003cp\u003eSemester 2: Design modular algorithmic solutions using appropriate abstract data types, including lists, stacks, queues, trees, heaps and hash tables.\u003c/p\u003e\n\u003cp\u003eSemester 1: Theoretically and experimentally evaluate different implementations of basic abstract data types;\u003c/p\u003e","cl_id":"eaa707f147c20b10448f409b136d43d6","ga_map":[]},{"lo_domain":[],"order":"2","number":"2","code":"ULO2","lo_cl_id":"eea707f147c20b10448f409b136d43d6","lo_domain_description":"","offerings":[],"linking_id":"c8f5137ac392921040721d4bb00131e4","academic_item":{"value":"FIT1008","cl_id":"9ea707f147c20b10448f409b136d43bd","key":"code"},"description":"\u003cp\u003eSemeste
